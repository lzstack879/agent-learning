[project]
name = "agent-learning"
version = "0.1.0"
description = "A progressive 12-week Agent engineering learning repository"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
agents = ["langgraph>=0.2", "langchain-core>=0.3"]
mcp = ["fastmcp>=2.0"]
memory = ["chromadb>=0.5"]
observability = ["langfuse>=2", "ragas>=0.2"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
